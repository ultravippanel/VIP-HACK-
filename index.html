<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Predictor UI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  background: black;
  overflow-x: hidden;
}.glow { box-shadow: 0 0 20px #00ff66; }

.wave span { display: inline-block; width: 4px; margin: 2px; background: #00ff66; animation: wave 1s infinite ease-in-out; }

.wave span:nth-child(1) { height: 20px; animation-delay: 0s; } .wave span:nth-child(2) { height: 35px; animation-delay: 0.2s; } .wave span:nth-child(3) { height: 25px; animation-delay: 0.4s; } .wave span:nth-child(4) { height: 40px; animation-delay: 0.6s; } .wave span:nth-child(5) { height: 28px; animation-delay: 0.8s; }

@keyframes wave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.8); } } </style>

</head>
<body class="flex justify-center items-center min-h-screen p-4"><div class="w-full max-w-sm border border-green-500 rounded-3xl p-5 text-white relative bg-black glow">  <div class="flex justify-between items-center mb-5">
    <div class="text-3xl">☰</div>

  </div>  <div class="text-center">

    class="w-40 mx-auto mb-4 drop-shadow-[0_0_20px_#00ff66]"><h2 class="text-5xl font-bold text-green-400 mb-4">PREDICTOR</h2>

<p class="tracking-[4px] text-gray-300 text-sm leading-7 mb-6">
  ALL GAMES CONNECTED<br>

</p>

  </div>  <div class="border border-green-500 rounded-2xl p-4 mb-5 bg-green-500/5">

        <h3 class="text-green-400 text-xl font-bold">SYSTEM ONLINE</h3>

      </div><div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

  </div>  <div class="border border-green-500 rounded-2xl p-5 mb-5 bg-green-500/5">

      JOIN CHANNEL 📢
    </button>
  </a></div><script>
function updateStats() {
  document.getElementById('ping').innerText =
    Math.floor(Math.random() * 30 + 10) + 'ms';

  document.getElementById('uptime').innerText =
    (99 + Math.random()).toFixed(2) + '%';

  let players = (Math.random() * 10 + 10).toFixed(1);
  document.getElementById('players').innerText = players + 'K';
}

setInterval(updateStats, 1500);
</script></body>
</html>
